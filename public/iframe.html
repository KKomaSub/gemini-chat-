<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Chat · iframe mode</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
    .wrap { width: min(860px, 100%); margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { opacity: .66; line-height: 1.5; }
    form { display: flex; gap: 8px; margin: 16px 0 12px; }
    input { flex: 1; min-width: 0; border: 1px solid color-mix(in srgb, CanvasText 20%, transparent); border-radius: 12px; padding: 12px; background: Canvas; color: CanvasText; font: inherit; }
    button { border: 0; border-radius: 12px; padding: 11px 15px; background: #4f7cff; color: white; font: inherit; font-weight: 700; }
    iframe { width: 100%; height: 65vh; border: 1px solid color-mix(in srgb, CanvasText 16%, transparent); border-radius: 16px; background: Canvas; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>iframe 응답 모드</h1>
    <p>버튼을 누르면 전체 페이지 대신 아래 프레임 안에 서버가 생성한 응답 HTML이 표시됩니다.</p>
    <form action="/api/chat" method="post" target="resultFrame" accept-charset="utf-8">
      <input type="hidden" name="history" value="[]">
      <input type="text" name="message" maxlength="4000" placeholder="메시지 입력" required>
      <button type="submit">보내기</button>
    </form>
    <iframe name="resultFrame" title="Gemini 응답"></iframe>
  </main>
</body>
</html>
